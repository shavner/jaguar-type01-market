name: Pages

# Publishes the page. Runs on your pushes, by hand, and from resolve.yml after it writes the result
# (pushes made by the workflow's own token don't trigger workflows, so resolve.yml calls this directly).
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main  # from resolve.yml, the commit it just pushed
      - run: mkdir _site && cp index.html market.json result.json reveal.ics _site/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
